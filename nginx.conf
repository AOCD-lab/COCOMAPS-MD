server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service.
    # The app is served under /BioTools/COCOMAPS-MD/, so the API is nested under the
    # same prefix — an upstream institutional proxy only needs to route that one path.
    # The trailing /api/ on proxy_pass strips the prefix back to the backend's own /api/.
    location /BioTools/COCOMAPS-MD/api/ {
        proxy_pass http://backend:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2G;
        proxy_read_timeout 600s;
    }

    # Direct (non-prefixed) API access — for hitting the container without an
    # upstream proxy (e.g. local `docker compose up`, debugging).
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2G;
        proxy_read_timeout 600s;
    }

    # Revalidate the HTML entry point so deployments do not retain old bundle URLs.
    location = /BioTools/COCOMAPS-MD/index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: serve index.html for all non-file routes under the base path
    location /BioTools/COCOMAPS-MD/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /BioTools/COCOMAPS-MD/index.html;
    }

    # Redirect root to the app
    location = / {
        return 301 /BioTools/COCOMAPS-MD/;
    }
}
