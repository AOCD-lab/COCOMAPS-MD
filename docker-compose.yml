services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "5001"
    volumes:
      - systems-data:/app/systems
    environment:
      - COCOMAPS_DEPS_DIR=/app/deps
      - COCOMAPS_JOB_WORKERS=2
      - PYTHONUNBUFFERED=1
      # Email notification when a job completes (leave SMTP_HOST empty to disable).
      # Values are taken from the shell or from the .env file next to this file.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - COCOMAPS_PUBLIC_URL=${COCOMAPS_PUBLIC_URL:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  cli:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - ./systems:/data/systems
    environment:
      - COCOMAPS_DEPS_DIR=/app/deps
    profiles:
      - cli

volumes:
  systems-data:
